# Local stack for EthioFoodCast: the FastAPI scoring service, plus the Next.js
# frontend workspace behind an opt-in profile.
#
#   docker compose up --build                       # api on http://localhost:5000, docs at /docs
#   docker compose run --rm api python -m pytest tests -q
#   docker compose --profile demo up --build        # adds the frontend on http://localhost:3001
#   docker compose logs -f api
#   docker compose down -v
#
# Both services publish to 127.0.0.1 on purpose. There is no authentication in
# this project (see the CORS comment in backend/api_server.py), so the stack must not
# answer on the LAN by default. Publish 0.0.0.0 only behind a reverse proxy that
# terminates auth and sets a real CORS origin list.
name: ethiofoodcast

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ethiofoodcast-api:local
    container_name: ethiofoodcast-api
    init: true                     # reap the uvicorn child process on SIGTERM
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      # Each worker deserialises the ~53 MB graph bundle separately. Raise only
      # with the RAM to hold them.
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      # config/paths.py takes the data directory from here. Serving reads nothing
      # from it; keeping it in /tmp stops Stage 0 input ever landing in /app.
      ETHIOFOODCAST_DATA: /tmp/ethiofoodcast-data
    # Writable scratch for matplotlib's font cache and joblib temporaries; the
    # image itself needs no other write access.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Uncomment to make the root filesystem read-only as well. Everything the
    # service writes goes to /tmp above, so this holds for scoring traffic;
    # pytest then needs -p no:cacheprovider, since it writes .pytest_cache.
    # read_only: true
    restart: unless-stopped

  # The Next.js workspace. Kept off the default `up` because frontend/ is a build
  # workspace, not a service the API depends on, and its build needs network
  # access for npm. Enable with: docker compose --profile demo up --build
  web:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # NEXT_PUBLIC_* is baked into the browser bundle during the build, so the
      # same value has to be passed here and as a runtime variable below. Set
      # only the runtime one and the bundle keeps the old URL.
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
    image: ethiofoodcast-web:local
    container_name: ethiofoodcast-web
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    environment:
      # Inlined into the client bundle at build time (NEXT_PUBLIC_* is baked by
      # Next), and used by server-rendered fetches at runtime when it is the
      # only URL given. Point it at the URL a browser can reach.
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
      # Server-side fetches on the compose network: the container's own
      # localhost is not the API's, so SSR uses the service name instead.
      API_INTERNAL_URL: "http://api:5000"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
